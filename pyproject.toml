[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vctl"
version = "0.2.0"
description = "Private macOS CLI client around Xray"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vctl = "vless_client.cli:main"

[tool.setuptools.packages.find]
include = ["vless_client*"]

[tool.setuptools.package-data]
vless_client = ["completions/_vctl"]
