  <path d="M368 418C394 391 428 378 461 378" stroke="#B8F6F5" stroke-width="18" stroke-linecap="round" opacity=".75"/>
  <!-- A tiny blowhole splash. -->
  <path d="M471 307C464 269 445 250 422 239M481 302C491 264 515 242 544 237" stroke="#75E3F3" stroke-width="22" stroke-linecap="round"/>
  <circle cx="409" cy="211" r="13" fill="#75E3F3"/>
  <circle cx="564" cy="210" r="10" fill="#75E3F3"/>
  <!-- Face. -->
  <ellipse cx="560" cy="478" rx="16" ry="21" fill="#09283F"/>
  <circle cx="565" cy="472" r="5" fill="white"/>
  <path d="M587 536C602 550 621 550 636 535" stroke="#0A2943" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="545" cy="535" rx="23" ry="12" fill="#F19FA3" opacity=".85"/>
  <!-- Mug handle stays visible outside the flipper. -->
  <path d="M801 461H832C866 461 880 481 880 514V546C880 581 862 599 830 599H804" stroke="#0A2943" stroke-width="48" stroke-linejoin="round"/>
  <path d="M801 461H832C866 461 880 481 880 514V546C880 581 862 599 830 599H804" stroke="#E7F6EE" stroke-width="24" stroke-linejoin="round"/>
  <path d="M662 424H811V619C811 637 798 650 780 650H694C676 650 662 637 662 619V424Z" fill="url(#beer)" stroke="#0A2943" stroke-width="16" stroke-linejoin="round"/>
  <path d="M693 478V591M733 478V606M773 478V591" stroke="#FFF0B2" stroke-width="12" stroke-linecap="round" opacity=".8"/>
  <path d="M657 438C638 428 641 401 661 394C655 366 685 349 706 365C718 338 751 340 764 362C789 350 817 366 813 391C837 396 841 426 823 439H755V464C755 477 734 477 734 464V438H657Z" fill="#FFF8E8" stroke="#0A2943" stroke-width="14" stroke-linejoin="round"/>
