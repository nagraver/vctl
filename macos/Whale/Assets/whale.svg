<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Whale — кит с пивом</title>
  <desc id="desc">Улыбающийся голубой кит держит в плавнике кружку золотистого пива на тёмно-синем фоне.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="80" x2="880" y2="960" gradientUnits="userSpaceOnUse"><stop stop-color="#163B60"/><stop offset="1" stop-color="#091C35"/></linearGradient>
    <linearGradient id="body" x1="260" y1="300" x2="600" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#75E3F3"/><stop offset="1" stop-color="#249AD2"/></linearGradient>
    <linearGradient id="beer" x1="720" y1="440" x2="720" y2="650" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD776"/><stop offset="1" stop-color="#EDA22B"/></linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="220" fill="url(#bg)"/>
  <path d="M220 808C355 850 655 860 805 800" stroke="#235171" stroke-width="22" stroke-linecap="round"/>
  <!-- Tail and body form one clear silhouette. -->
  <path d="M336 573C275 568 247 531 238 480C196 482 160 458 143 422C128 486 139 541 182 578C158 617 159 657 181 695C198 649 228 638 263 655C284 741 369 791 484 786C618 780 695 696 690 578C686 458 617 355 507 346C393 336 308 418 313 516C314 537 323 557 336 573Z" fill="url(#body)" stroke="#0A2943" stroke-width="18" stroke-linejoin="round"/>
