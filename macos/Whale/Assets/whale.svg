  <path d="M577 615C613 631 652 619 675 590C689 573 711 576 716 593C723 620 691 659 656 674C628 686 598 680 579 667" fill="#36AFDC" stroke="#0A2943" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M602 643C631 649 656 637 674 619" stroke="#77DEF0" stroke-width="10" stroke-linecap="round"/>
